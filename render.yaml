databases:
  - name: livedesk-db
    plan: free

services:
  - type: web
    name: livedesk-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: APP_ENV
        value: production
      - key: AGENT_TOKEN
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: livedesk-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
